services:
  - type: web
    name: strflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- Se configuran en el panel de Render (marcadas como secretas) ---
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: strflow
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: EXTERNAL_API_URL
        value: https://sapapi.red.com.sv/api/Procesos/solicitudtraslado
      - key: EXTERNAL_API_KEY
        sync: false
      - key: SYNC_MIN_DATE
        value: "2026-10-01T00:00:00Z"
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_EDUARDO_EMAIL
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: STRflow
      - key: APPROVAL_TOKEN_TTL_HOURS
        value: "72"
      - key: REVERT_WINDOW_SECONDS
        value: "10"
      # Contraseñas iniciales para `npm run seed`.
      - key: AUTH_GLOBAL_EMAIL
        value: gerentegeneral@red.com
      - key: AUTH_GLOBAL_PASSWORD
        sync: false
      - key: AUTH_GUATEMALA_PASSWORD
        sync: false
      - key: AUTH_ELSALVADOR_PASSWORD
        sync: false
      # APPROVAL_PUBLIC_URL se omite a proposito: si no esta, el servidor usa
      # RENDER_EXTERNAL_URL, que Render inyecta con la URL publica real.
